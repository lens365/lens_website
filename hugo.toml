baseURL = "https://lens-website-theta.vercel.app/"
title = "Lens -- Website"
theme = "hugo-coder"
languageCode = "en"
defaultContentLanguage = "en"
enableEmoji = true

[pagination]
pagerSize = 6

[markup]
[markup.highlight]
noClasses = false

[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.extensions]
[markup.goldmark.extensions.passthrough]
enable = true

[markup.goldmark.extensions.passthrough.delimiters]
block = [['\[', '\]'], ['$$', '$$']]
inline = [['\(', '\)'], ['$', '$']]

[params]
# ===== 主要个人信息 =====
author = "lens lei "                    # 改成你的名字（英文）
description = "Welcome to my personal website"  # 网站描述
keywords = "blog,developer,personal"
info = ["  Tongji -- 自动化  " , "  大二  " ]  # 首页显示的职业信息
avatarURL = "images/avatar.png"           # 头像图片路径
since = 2026                             # 网站开始年份
colorScheme = "auto"                      # 颜色主题：auto/light/dark
hideColorSchemeToggle = false
customCSS = ["css/custom.css"]

# ===== 社交链接 =====
[[params.social]]
name = "Github"
icon = "fa-brands fa-github fa-2x"
weight = 1
url = "https://github.com/lens365"  # 改成你的 GitHub

[[params.social]]
name = "Email:lensarism365@gmail.com"
icon = "fa-solid fa-envelope fa-2x"
weight = 2
url = "lensarism365@gmail.com"     # 改成你的邮箱

# ===== 英文菜单 =====
[languages.en]
languageName = "English"
weight = 1

[[languages.en.menu.main]]
name = "About"
weight = 1
url = "about/"

[[languages.en.menu.main]]
name = "Blog"
weight = 2
url = "posts/"

[[languages.en.menu.main]]
name = "Projects"
weight = 3
url = "projects/"

[[languages.en.menu.main]]
name = "Contact"
weight = 4
url = "contact/"

# ===== 中文配置 =====
[languages.zh-cn]
languageName = "中文"
weight = 2
title = "Lens -- Website"

[languages.zh-cn.params]
author = "Lens"
description = "欢迎来到我的个人网站"
keywords = "博客，开发者"
info = [" Tongji -- 自动化", "大二"]

[[languages.zh-cn.menu.main]]
name = "关于"
weight = 1
