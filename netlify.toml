# Netlify configuration - not used by Vercel
# This file is kept for reference but should not be used by Vercel
# Vercel uses vercel.json for configuration

[build]
publish = "public"
command = "hugo --gc --minify"

[build.environment]
HUGO_VERSION = "0.126.0"

[context.deploy-preview]
command = "hugo --gc --minify --buildFuture --buildDrafts"
