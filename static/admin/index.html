<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="color-scheme" content="light dark">
  <title>Post Edit - Lens</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" media="(prefers-color-scheme: light)">
  <script src="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-body: #faf9f7; --bg-card: #fff; --bg-input: #fff; --bg-code: #f8f9fa;
      --fg-main: #1f1f1f; --fg-label: #555; --fg-help: #666;
      --border-main: #e0e0e0; --border-input: #ddd; --border-code: #e0e0e0;
      --btn-bg: #1f1f1f; --btn-fg: #fff; --btn-hover: #333;
      --btn-disabled-bg: #ccc; --btn-disabled-fg: #666; --shadow: rgba(0,0,0,0.05);
      --status-success-bg: #d4edda; --status-success-fg: #155724; --status-success-border: #c3e6cb;
      --status-error-bg: #f8d7da; --status-error-fg: #721c24; --status-error-border: #f5c6cb;
      --cm-bg: #fff; --cm-fg: #1f1f1f; --cm-cursor: #1f1f1f;
      --cm-toolbar-bg: #faf9f7; --cm-toolbar-btn: #555;
      --cm-toolbar-btn-hover-bg: #e0e0e0; --cm-toolbar-btn-hover-fg: #1f1f1f;
    }
    [data-theme="dark"] {
      --bg-body: #0d0d0d; --bg-card: #1a1a1a; --bg-input: #262626; --bg-code: #262626;
      --fg-main: #e8e6e1; --fg-label: #d4d2cc; --fg-help: #888;
      --border-main: #333; --border-input: #333; --border-code: #333;
      --btn-bg: #e8e6e1; --btn-fg: #0d0d0d; --btn-hover: #d4d2cc;
      --btn-disabled-bg: #444; --btn-disabled-fg: #888; --shadow: rgba(0,0,0,0.2);
      --status-success-bg: #1a3a1a; --status-success-fg: #7cb342; --status-success-border: #2e5c2e;
      --status-error-bg: #3a1a1a; --status-error-fg: #e57373; --status-error-border: #5c2e2e;
      --cm-bg: #262626; --cm-fg: #e8e6e1; --cm-cursor: #e8e6e1;
      --cm-toolbar-bg: #1a1a1a; --cm-toolbar-btn: #d4d2cc;
      --cm-toolbar-btn-hover-bg: #333; --cm-toolbar-btn-hover-fg: #e8e6e1;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg-body); color: var(--fg-main); line-height: 1.6; transition: background 0.3s ease, color 0.3s ease; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h1 { font-size: 1.5rem; color: var(--fg-main); }
    .back-link { color: var(--fg-label); text-decoration: none; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border-main); background: var(--bg-card); transition: background 0.2s ease, color 0.2s ease; }
    .back-link:hover { background: var(--bg-input); color: var(--fg-main); }
    .section { background: var(--bg-card); border-radius: 8px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border-main); box-shadow: 0 1px 3px var(--shadow); transition: background 0.3s ease, border-color 0.3s ease; }
    label { display: block; font-weight: 600; margin-bottom: 5px; color: var(--fg-label); }
    input[type="text"], input[type="date"] { width: 100%; padding: 10px; border: 1px solid var(--border-input); border-radius: 6px; font-size: 14px; font-family: inherit; background: var(--bg-input); color: var(--fg-main); transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
    .row.single { grid-template-columns: 1fr; }
    button { background: var(--btn-bg); color: var(--btn-fg); border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; transition: background 0.2s ease; }
    button:hover { background: var(--btn-hover); }
    button:disabled { background: var(--btn-disabled-bg); color: var(--btn-disabled-fg); cursor: not-allowed; }
    .token-input { margin-bottom: 20px; }
    .help { font-size: 12px; color: var(--fg-help); margin-top: 4px; transition: color 0.3s ease; }
    .status { padding: 12px; border-radius: 6px; margin-top: 15px; display: none; }
    .status.success { background: var(--status-success-bg); color: var(--status-success-fg); display: block; border: 1px solid var(--status-success-border); }
    .status.error { background: var(--status-error-bg); color: var(--status-error-fg); display: block; border: 1px solid var(--status-error-border); }

    /* Search */
    .search-box { position: relative; }
    .search-box input { width: 100%; padding: 10px 14px; border: 1px solid var(--border-input); border-radius: 6px; font-size: 14px; background: var(--bg-input); color: var(--fg-main); transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
    .search-results { position: absolute; top: 100%; left: 0; right: 0; background: var(--bg-card); border: 1px solid var(--border-main); border-radius: 6px; box-shadow: 0 4px 12px var(--shadow); max-height: 320px; overflow-y: auto; z-index: 100; margin-top: 4px; display: none; }
    .search-results.active { display: block; }
    .search-result-item { padding: 12px 16px; border-bottom: 1px solid var(--border-main); cursor: pointer; transition: background 0.2s; }
    .search-result-item:hover { background: var(--bg-input); }
    .search-result-item:last-child { border-bottom: none; }
    .search-result-title { font-weight: 600; color: var(--fg-main); margin-bottom: 4px; font-size: 14px; }
    .search-result-excerpt { font-size: 12px; color: var(--fg-help); line-height: 1.5; }
    .search-no-results { padding: 16px; color: var(--fg-help); text-align: center; font-size: 14px; }
    .search-loading { padding: 16px; color: var(--fg-help); text-align: center; font-size: 14px; }

    /* EasyMDE Theme Override */
    .EasyMDEContainer { border: 1px solid var(--border-input) !important; border-radius: 6px !important; overflow: hidden; }
    .EasyMDEContainer .CodeMirror { background: var(--cm-bg) !important; color: var(--cm-fg) !important; border: none !important; }
    .EasyMDEContainer .CodeMirror-cursor { border-color: var(--cm-cursor) !important; }
    .EasyMDEContainer .editor-toolbar { background: var(--cm-toolbar-bg) !important; border-bottom: 1px solid var(--border-main) !important; }
    .EasyMDEContainer .editor-toolbar button { color: var(--cm-toolbar-btn) !important; background: transparent !important; border: none !important; }
    .EasyMDEContainer .editor-toolbar button:hover { background: var(--cm-toolbar-btn-hover-bg) !important; color: var(--cm-toolbar-btn-hover-fg) !important; }
    .EasyMDEContainer .editor-toolbar i { color: inherit !important; }
    .editor-preview { background: var(--cm-bg) !important; color: var(--cm-fg) !important; }
    .editor-preview h1, .editor-preview h2, .editor-preview h3, .editor-preview h4, .editor-preview h5, .editor-preview h6 { color: var(--cm-fg) !important; }
    .editor-preview pre { background: var(--bg-code) !important; border: 1px solid var(--border-code) !important; border-radius: 6px; padding: 16px; overflow-x: auto; margin: 1em 0; }
    .editor-preview pre code { background: transparent !important; border: none !important; padding: 0 !important; border-radius: 0 !important; color: inherit !important; font-family: "SF Mono", SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; font-size: 14px; line-height: 1.6; }
    .editor-preview code { background: var(--bg-code) !important; color: #d4a574 !important; border-radius: 4px; padding: 2px 6px; font-family: "SF Mono", SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; font-size: 0.9em; }
    .editor-preview blockquote { border-left: 3px solid #8b5e3c !important; background: var(--bg-code) !important; padding: 12px 16px; margin: 1em 0; border-radius: 0 6px 6px 0; }
    .cm-header { color: #d4a574 !important; font-weight: 600 !important; }
    .cm-strong { font-weight: 700 !important; color: var(--cm-fg) !important; }
    .cm-em { font-style: italic !important; color: var(--fg-label) !important; }
    .cm-link { color: #8b5e3c !important; }
    .cm-url { color: #d4a574 !important; }
    .cm-quote { color: var(--fg-help) !important; font-style: italic !important; }
    .cm-code { background: var(--bg-code) !important; color: #d4a574 !important; border-radius: 3px; padding: 0 3px; }
    .cm-comment { color: var(--fg-help) !important; }
  </style>
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h1>Post Edit</h1>
      <a href="/" class="back-link">&larr; Return</a>
    </div>
    <div class="section token-input">
      <label>GitHub Personal Access Token</label>
      <input type="text" id="token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
      <p class="help">Generate at https://github.com/settings/tokens, check repo scope</p>
    </div>
    <div class="section">
      <div class="row">
        <div><label>Title</label><input type="text" id="title" placeholder="Article Title"></div>
        <div><label>Filename (auto-generated if empty)</label><input type="text" id="filename" placeholder="my-post"></div>
      </div>
      <div class="row">
        <div><label>Date</label><input type="date" id="date"></div>
        <div><label>Categories (comma separated)</label><input type="text" id="categories" placeholder="notes, tech"></div>
      </div>
      <div class="row single"><div><label>Tags (comma separated)</label><input type="text" id="tags" placeholder="hugo, blog"></div></div>
      <div class="row single"><div><label>Content (Markdown supported)</label><textarea id="content"></textarea></div></div>
      <button id="submit" onclick="publish()">Publish</button>
      <div id="status" class="status"></div>
    </div>
  </div>
  <script>
    (function initTheme() {
      const saved = localStorage.getItem('colorscheme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.style.colorScheme = theme;
    })();

    const urlParams = new URLSearchParams(window.location.search);
    const editPath = urlParams.get('edit');
    if (!editPath) localStorage.removeItem('smde_lens-blog-editor');

    const easyMDE = new EasyMDE({
      element: document.getElementById('content'),
      spellChecker: false,
      autosave: { enabled: true, delay: 5000, uniqueId: 'lens-blog-editor' },
      toolbar: ['bold','italic','heading','|','quote','unordered-list','ordered-list','|','link','image','code','|','undo','redo','|','preview','side-by-side','fullscreen','|','guide'],
      status: false,
      minHeight: '300px',
      placeholder: '# Write your article here...\n\nMarkdown syntax supported, preview on the right'
    });

    const observer = new MutationObserver((mutations) => {
      mutations.forEach((m) => {
        m.addedNodes.forEach((node) => {
          if (node.nodeType === 1) {
            const blocks = node.matches?.('pre code') ? [node] : node.querySelectorAll?.('pre code') || [];
            blocks.forEach((b) => hljs.highlightElement(b));
          }
        });
      });
    });
    observer.observe(document.body, { childList: true, subtree: true });

    document.getElementById('date').valueAsDate = new Date();
    const pendingImages = new Map();
    document.addEventListener('paste', function(e) {
      const activeElement = document.activeElement;
      const isInEditor = activeElement && (
        activeElement.classList.contains('CodeMirror-code') ||
        activeElement.closest('.EasyMDEContainer') ||
        activeElement.id === 'content'
      );
      if (!isInEditor) return;
      const items = e.clipboardData.items;
      for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf('image') !== -1) {
          e.preventDefault();
          const blob = items[i].getAsFile();
          const blobUrl = URL.createObjectURL(blob);
          pendingImages.set(blobUrl, blob);
          const cm = easyMDE.codemirror;
          const cursor = cm.getCursor();
          cm.replaceRange(`\n![image](${blobUrl})\n`, cursor);
          showStatus('Image inserted (blob preview, auto-upload on publish)', false);
          break;
        }
      }
    });

    async function uploadBlobImage(blob, token) {
      const ext = blob.type === 'image/jpeg' ? 'jpg' : (blob.type.split('/')[1] || 'png');
      const filename = `image-${Date.now()}-${Math.random().toString(36).substr(2, 6)}.${ext}`;
      const path = `static/images/${filename}`;
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = async function() {
          const base64Content = reader.result.split(',')[1];
          let sha = null;
          try {
            const checkRes = await fetch(`https://api.github.com/repos/lens365/lens_website/contents/${path}`, {
              headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
            });
            if (checkRes.status === 200) {
              const data = await checkRes.json();
              sha = data.sha;
            }
          } catch (e) {}
          const body = { message: `upload image: ${filename}`, content: base64Content, branch: 'main' };
          if (sha) body.sha = sha;
          try {
            const res = await fetch(`https://api.github.com/repos/lens365/lens_website/contents/${path}`, {
              method: 'PUT',
              headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
              body: JSON.stringify(body)
            });
            if (res.ok) {
              const data = await res.json();
              resolve(data.content.download_url);
            } else {
              const err = await res.json();
              reject(new Error(err.message || 'Upload failed'));
            }
          } catch (err) { reject(err); }
        };
        reader.onerror = () => reject(new Error('Failed to read file'));
        reader.readAsDataURL(blob);
      });
    }

    async function processBlobImages(content, token) {
      const regex = /!\[([^\]]*)\]\((blob:[^)]+)\)/gi;
      let result = content;
      let match;
      while ((match = regex.exec(content)) !== null) {
        const fullMatch = match[0];
        const altText = match[1];
        const blobUrl = match[2];
        const blob = pendingImages.get(blobUrl);
        if (blob) {
          try {
            showStatus('Uploading images...', false);
            const url = await uploadBlobImage(blob, token);
            result = result.replace(fullMatch, `![${altText}](${url})`);
            URL.revokeObjectURL(blobUrl);
            pendingImages.delete(blobUrl);
          } catch (err) { console.error('Upload image failed:', err); }
        }
      }
      return result;
    }

    function showStatus(msg, isError) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status ' + (isError ? 'error' : 'success');
    }

    const tokenInput = document.getElementById('token');
    if (editPath) {
      document.querySelector('.page-header h1').textContent = 'Edit Post';
      document.getElementById('submit').textContent = 'Save Changes';
      document.querySelector('.section:last-child').style.display = 'none';
      showStatus('Please enter GitHub Token to load article', false);
    } else { clearForm(); }

    function clearForm() {
      document.getElementById('title').value = '';
      document.getElementById('filename').value = '';
      document.getElementById('date').valueAsDate = new Date();
      document.getElementById('categories').value = '';
      document.getElementById('tags').value = '';
      easyMDE.value('');
    }

    tokenInput.addEventListener('change', async function () {
      const token = this.value.trim();
      if (!token) return;
      if (editPath) {
        showStatus('Loading article...', false);
        await loadArticle(editPath, token);
      }
    });

    async function loadArticle(path, token) {
      if (!token) token = document.getElementById('token').value.trim();
      if (!token) { showStatus('Please enter GitHub Token first', true); return; }
      try {
        const res = await fetch(`https://api.github.com/repos/lens365/lens_website/contents/${path}`, {
          headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
        });
        if (res.ok) {
          const data = await res.json();
          const content = decodeURIComponent(escape(atob(data.content)));
          const match = content.match(/^\+\+\+([\s\S]*?)\+\+\+([\s\S]*)$/);
          if (match) {
            const frontMatter = match[1];
            const body = match[2].trim();
            const titleMatch = frontMatter.match(/title\s*=\s*"([^"]+)"/);
            const dateMatch = frontMatter.match(/date\s*=\s*"([^"]+)"/);
            const tagsMatch = frontMatter.match(/tags\s*=\s*\[(.*?)\]/);
            const catsMatch = frontMatter.match(/categories\s*=\s*\[(.*?)\]/);
            if (titleMatch) document.getElementById('title').value = titleMatch[1];
            if (dateMatch) document.getElementById('date').value = dateMatch[1];
            if (tagsMatch) document.getElementById('tags').value = tagsMatch[1].split(',').map(s => s.trim().replace(/"/g, '')).join(', ');
            if (catsMatch) document.getElementById('categories').value = catsMatch[1].split(',').map(s => s.trim().replace(/"/g, '')).join(', ');
            easyMDE.value(body);
            document.getElementById('filename').value = path.replace('content/posts/', '').replace('.md', '');
            document.querySelector('.section:last-child').style.display = 'block';
            showStatus('Article loaded, you can start editing', false);
          }
        } else {
          showStatus('Failed to load article, please check Token permissions', true);
        }
      } catch (err) {
        showStatus('Failed to load article: ' + err.message, true);
      }
    }

    async function publish() {
      const token = document.getElementById('token').value.trim();
      const title = document.getElementById('title').value.trim();
      let filename = document.getElementById('filename').value.trim();
      const date = document.getElementById('date').value;
      const categories = document.getElementById('categories').value.split(',').map(s => s.trim()).filter(s => s);
      const tags = document.getElementById('tags').value.split(',').map(s => s.trim()).filter(s => s);
      const content = easyMDE.value();
      if (!token) { showStatus('Please enter GitHub Token', true); return; }
      if (!title) { showStatus('Please enter title', true); return; }
      if (!filename) { filename = title.toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]+/g, '-').replace(/^-|-$/g, ''); }
      if (!date) { showStatus('Please select date', true); return; }
      const btn = document.getElementById('submit');
      btn.disabled = true;
      const originalText = btn.textContent;
      btn.textContent = editPath ? 'Saving...' : 'Publishing...';
      let processedContent = token ? await processBlobImages(content, token) : content;
      let frontMatter = `+++\ntitle = "${title}"\ndescription = "${title} - Lens Note"\ndate = "${date}"\ndraft = false\n`;
      if (tags.length) frontMatter += `tags = [${tags.map(t => `"${t}"`).join(', ')}]\n`;
      if (categories.length) frontMatter += `categories = [${categories.map(c => `"${c}"`).join(', ')}]\n`;
      frontMatter += `+++\n\n${processedContent}`;
      const path = editPath || `content/posts/${filename}.md`;
      const encodedContent = btoa(unescape(encodeURIComponent(frontMatter)));
      try {
        let sha = null;
        try {
          const checkRes = await fetch(`https://api.github.com/repos/lens365/lens_website/contents/${path}`, {
            headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
          });
          if (checkRes.status === 200) {
            const data = await checkRes.json();
            sha = data.sha;
          }
        } catch (e) {}
        const body = { message: editPath ? `post: update ${filename}` : `post: add ${filename}`, content: encodedContent, branch: 'main' };
        if (sha) body.sha = sha;
        const res = await fetch(`https://api.github.com/repos/lens365/lens_website/contents/${path}`, {
          method: 'PUT',
          headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        if (res.ok) {
          showStatus(`${editPath ? 'Update successful' : 'Publish successful'}! Article will be displayed after deployment`, false);
          if (!editPath) clearForm();
        } else {
          const err = await res.json();
          showStatus(`Failed: ${err.message || res.statusText}`, true);
        }
      } catch (err) {
        showStatus(`Error: ${err.message}`, true);
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    }
  </script>
</body>
</html>
