<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="color-scheme" content="light dark">
  <title>post edit - Lens</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css">
  <script src="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-body: #faf9f7;
      --bg-card: #fff;
      --bg-input: #fff;
      --bg-code: #f8f9fa;
      --fg-main: #1f1f1f;
      --fg-label: #555;
      --fg-help: #666;
      --border-main: #e0e0e0;
      --border-input: #ddd;
      --border-code: #e0e0e0;
      --btn-bg: #1f1f1f;
      --btn-fg: #fff;
      --btn-hover: #333;
      --btn-disabled-bg: #ccc;
      --btn-disabled-fg: #666;
      --shadow: rgba(0,0,0,0.05);
      --status-success-bg: #d4edda;
      --status-success-fg: #155724;
      --status-success-border: #c3e6cb;
      --status-error-bg: #f8d7da;
      --status-error-fg: #721c24;
      --status-error-border: #f5c6cb;
      --cm-bg: #fff;
      --cm-fg: #1f1f1f;
      --cm-cursor: #1f1f1f;
      --cm-toolbar-bg: #faf9f7;
      --cm-toolbar-btn: #555;
      --cm-toolbar-btn-hover-bg: #e0e0e0;
      --cm-toolbar-btn-hover-fg: #1f1f1f;
    }

    [data-theme="dark"] {
      --bg-body: #0d0d0d;
      --bg-card: #1a1a1a;
      --bg-input: #262626;
      --bg-code: #262626;
      --fg-main: #e8e6e1;
      --fg-label: #d4d2cc;
      --fg-help: #888;
      --border-main: #333;
      --border-input: #333;
      --border-code: #333;
      --btn-bg: #e8e6e1;
      --btn-fg: #0d0d0d;
      --btn-hover: #d4d2cc;
      --btn-disabled-bg: #444;
      --btn-disabled-fg: #888;
      --shadow: rgba(0,0,0,0.2);
      --status-success-bg: #1a3a1a;
      --status-success-fg: #7cb342;
      --status-success-border: #2e5c2e;
      --status-error-bg: #3a1a1a;
      --status-error-fg: #e57373;
      --status-error-border: #5c2e2e;
      --cm-bg: #262626;
      --cm-fg: #e8e6e1;
      --cm-cursor: #e8e6e1;
      --cm-toolbar-bg: #1a1a1a;
      --cm-toolbar-btn: #d4d2cc;
      --cm-toolbar-btn-hover-bg: #333;
      --cm-toolbar-btn-hover-fg: #e8e6e1;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-body);
      color: var(--fg-main);
      line-height: 1.6;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: var(--fg-main);
    }

    .section {
      background: var(--bg-card);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid var(--border-main);
      box-shadow: 0 1px 3px var(--shadow);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 5px;
      color: var(--fg-label);
    }

    input[type="text"],
    input[type="date"] {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-input);
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      background: var(--bg-input);
      color: var(--fg-main);
      transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 15px;
    }

    .row.single {
      grid-template-columns: 1fr;
    }

    button {
      background: var(--btn-bg);
      color: var(--btn-fg);
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.2s ease;
    }

    button:hover {
      background: var(--btn-hover);
    }

    button:disabled {
      background: var(--btn-disabled-bg);
      color: var(--btn-disabled-fg);
      cursor: not-allowed;
    }

    .token-input {
      margin-bottom: 20px;
    }

    .help {
      font-size: 12px;
      color: var(--fg-help);
      margin-top: 4px;
      transition: color 0.3s ease;
    }

    .status {
      padding: 12px;
      border-radius: 6px;
      margin-top: 15px;
      display: none;
    }

    .status.success {
      background: var(--status-success-bg);
      color: var(--status-success-fg);
      display: block;
      border: 1px solid var(--status-success-border);
    }

    .status.error {
      background: var(--status-error-bg);
      color: var(--status-error-fg);
      display: block;
      border: 1px solid var(--status-error-border);
    }

    /* EasyMDE Theme Override */
    .EasyMDEContainer {
      border: 1px solid var(--border-input) !important;
      border-radius: 6px !important;
      overflow: hidden;
    }

    .EasyMDEContainer .CodeMirror {
      background: var(--cm-bg) !important;
      color: var(--cm-fg) !important;
      border: none !important;
    }

    .EasyMDEContainer .CodeMirror-cursor {
      border-color: var(--cm-cursor) !important;
    }

    .EasyMDEContainer .editor-toolbar {
      background: var(--cm-toolbar-bg) !important;
      border-bottom: 1px solid var(--border-main) !important;
    }

    .EasyMDEContainer .editor-toolbar button {
      color: var(--cm-toolbar-btn) !important;
      background: transparent !important;
      border: none !important;
    }

    .EasyMDEContainer .editor-toolbar button:hover {
      background: var(--cm-toolbar-btn-hover-bg) !important;
      color: var(--cm-toolbar-btn-hover-fg) !important;
    }

    .EasyMDEContainer .editor-toolbar i {
      color: inherit !important;
    }

    .editor-preview {
      background: var(--cm-bg) !important;
      color: var(--cm-fg) !important;
    }

    .editor-preview h1,
    .editor-preview h2,
    .editor-preview h3,
    .editor-preview h4,
    .editor-preview h5,
    .editor-preview h6 {
      color: var(--cm-fg) !important;
    }

    .editor-preview pre {
      background: var(--bg-code) !important;
      border: 1px solid var(--border-code) !important;
    }

    .editor-preview code {
      background: var(--bg-code) !important;
      color: #d4a574 !important;
      border-radius: 3px;
      padding: 0 3px;
    }

    .editor-preview blockquote {
      border-left: 3px solid #8b5e3c !important;
      background: var(--bg-code) !important;
    }

    .cm-header {
      color: #d4a574 !important;
      font-weight: 600 !important;
    }

    .cm-strong {
      font-weight: 700 !important;
      color: var(--cm-fg) !important;
    }

    .cm-em {
      font-style: italic !important;
      color: var(--fg-label) !important;
    }

    .cm-link {
      color: #8b5e3c !important;
    }

    .cm-url {
      color: #d4a574 !important;
    }

    .cm-quote {
      color: var(--fg-help) !important;
      font-style: italic !important;
    }

    .cm-code {
      background: var(--bg-code) !important;
      color: #d4a574 !important;
      border-radius: 3px;
      padding: 0 3px;
    }

    .cm-comment {
      color: var(--fg-help) !important;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Post Edit</h1>

    <div class="section token-input">
      <label>GitHub Personal Access Token</label>
      <input type="text" id="token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
      <p class="help">在 https://github.com/settings/tokens 生成，勾选 repo 权限</p>
    </div>

    <div class="section">
      <div class="row">
        <div>
          <label>标题</label>
          <input type="text" id="title" placeholder="文章标题">
        </div>
        <div>
          <label>文件名（可留空，自动生成）</label>
          <input type="text" id="filename" placeholder="my-post">
        </div>
      </div>
      <div class="row">
        <div>
          <label>日期</label>
          <input type="date" id="date">
        </div>
        <div>
          <label>分类（用逗号分隔）</label>
          <input type="text" id="categories" placeholder="笔记, 技术">
        </div>
      </div>
      <div class="row single">
        <div>
          <label>标签（用逗号分隔）</label>
          <input type="text" id="tags" placeholder="hugo, blog">
        </div>
      </div>
      <div class="row single">
        <div>
          <label>正文（支持 Markdown 实时预览）</label>
          <textarea id="content"></textarea>
        </div>
      </div>
      <button id="submit" onclick="publish()">发布文章</button>
      <div id="status" class="status"></div>
    </div>
  </div>

  <script>
    // 主题管理：自动跟随网站主题（localStorage）或系统偏好
    (function initTheme() {
      const saved = localStorage.getItem('colorscheme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.style.colorScheme = theme;
    })();

    // 检查是否是新建文章模式
    const urlParams = new URLSearchParams(window.location.search);
    const editPath = urlParams.get('edit');

    // 新建文章模式下，先清除 EasyMDE 的 autosave 缓存（必须在初始化前）
    if (!editPath) {
      localStorage.removeItem('smde_lens-blog-editor');
    }

    // 初始化 EasyMDE
    const easyMDE = new EasyMDE({
      element: document.getElementById('content'),
      spellChecker: false,
      autosave: {
        enabled: true,
        delay: 5000,
        uniqueId: 'lens-blog-editor'
      },
      toolbar: [
        'bold', 'italic', 'heading', '|',
        'quote', 'unordered-list', 'ordered-list', '|',
        'link', 'image', 'code', '|',
        'preview', 'side-by-side', 'fullscreen', '|',
        'guide'
      ],
      status: false,
      minHeight: '300px',
      placeholder: '# 在这里写你的文章...\n\n支持 Markdown 语法，右侧可以预览效果'
    });

    // 设置默认日期
    document.getElementById('date').valueAsDate = new Date();

    // 图片粘贴功能：base64 放文档末尾引用，正文只留短引用
    document.addEventListener('paste', function(e) {
      const activeElement = document.activeElement;
      const isInEditor = activeElement && (
        activeElement.classList.contains('CodeMirror-code') ||
        activeElement.closest('.EasyMDEContainer') ||
        activeElement.id === 'content'
      );
      if (!isInEditor) return;

      const items = e.clipboardData.items;
      for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf('image') !== -1) {
          e.preventDefault();
          const blob = items[i].getAsFile();
          const reader = new FileReader();
          reader.onload = function(evt) {
            const base64 = evt.target.result;
            const refId = `img_${Date.now()}_${Math.random().toString(36).substr(2, 4)}`;
            const cm = easyMDE.codemirror;
            const cursor = cm.getCursor();

            // 正文插入短引用
            cm.replaceRange(`\n![image][${refId}]\n`, cursor);

            // 在文档末尾追加 base64 引用定义
            const lastLine = cm.lastLine();
            const lastLineContent = cm.getLine(lastLine);
            const prefix = lastLineContent.trim() ? '\n\n' : '\n';
            cm.replaceRange(`${prefix}[${refId}]: ${base64}\n`, { line: lastLine, ch: lastLineContent.length });

            showStatus('图片已插入（正文短引用，base64 在文档末尾，发布时自动上传）', false);
          };
          reader.onerror = () => showStatus('读取图片失败', true);
          reader.readAsDataURL(blob);
          break;
        }
      }
    });

    // 上传单张图片到 GitHub
    async function uploadImageToGithub(base64Data, mimeType, token) {
      const ext = mimeType === 'jpeg' ? 'jpg' : mimeType;
      const filename = `image-${Date.now()}-${Math.random().toString(36).substr(2, 6)}.${ext}`;
      const path = `static/images/${filename}`;
      const base64Content = base64Data.split(',')[1];

      let sha = null;
      try {
        const checkRes = await fetch(`https://api.github.com/repos/lens365/lens_website/contents/${path}`, {
          headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
        });
        if (checkRes.status === 200) {
          const data = await checkRes.json();
          sha = data.sha;
        }
      } catch (e) {}

      const body = {
        message: `upload image: ${filename}`,
        content: base64Content,
        branch: 'main'
      };
      if (sha) body.sha = sha;

      const res = await fetch(`https://api.github.com/repos/lens365/lens_website/contents/${path}`, {
        method: 'PUT',
        headers: {
          'Authorization': `token ${token}`,
          'Accept': 'application/vnd.github.v3+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      });

      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.message || '上传失败');
      }
      const data = await res.json();
      return data.content.download_url;
    }

    // 发布前扫描引用式 base64 图片并上传
    async function processBase64Images(content, token) {
      // 匹配 ![alt][refId] 和 [refId]: data:image/...;base64,...
      const refRegex = /!\[([^\]]*)\]\[([^\]]+)\]/gi;
      const defRegex = /^\[([^\]]+)\]: (data:image\/([a-z0-9]+);base64,([A-Za-z0-9+/=]+))$/gim;

      // 先收集所有引用定义
      const defs = {};
      let m;
      while ((m = defRegex.exec(content)) !== null) {
        defs[m[1]] = {
          full: m[0],
          base64: m[2],
          mimeType: m[4]
        };
      }

      let result = content;
      const usedRefs = new Set();

      // 扫描正文中的引用
      while ((m = refRegex.exec(content)) !== null) {
        const fullMatch = m[0];
        const altText = m[1];
        const refId = m[2];

        if (defs[refId]) {
          usedRefs.add(refId);
          try {
            showStatus('正在上传文章中的图片...', false);
            const url = await uploadImageToGithub(defs[refId].base64, defs[refId].mimeType, token);
            result = result.replace(fullMatch, `![${altText}](${url})`);
          } catch (err) {
            console.error('上传图片失败:', err);
          }
        }
      }

      // 删除已上传的引用定义行
      for (const refId of usedRefs) {
        if (defs[refId]) {
          result = result.replace(defs[refId].full + '\n', '');
          result = result.replace(defs[refId].full, '');
        }
      }

      return result;
    }

    function showStatus(msg, isError) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status ' + (isError ? 'error' : 'success');
    }

    const tokenInput = document.getElementById('token');

    if (editPath) {
      document.querySelector('h1').textContent = 'Edit Post';
      document.getElementById('submit').textContent = 'Save Changes';
      // 先隐藏编辑区域，等 token 输入后再显示
      document.querySelector('.section:last-child').style.display = 'none';
      showStatus('请输入 GitHub Token 以加载文章', false);
    } else {
      // 新建文章模式：清空所有表单
      clearForm();
    }

    // 清空表单函数
    function clearForm() {
      document.getElementById('title').value = '';
      document.getElementById('filename').value = '';
      document.getElementById('date').valueAsDate = new Date();
      document.getElementById('categories').value = '';
      document.getElementById('tags').value = '';
      easyMDE.value('');
    }

    // 监听 token 输入，输入后自动加载（编辑模式）
    tokenInput.addEventListener('change', async function () {
      const token = this.value.trim();
      if (!token) return;

      if (editPath) {
        showStatus('正在加载文章...', false);
        await loadArticle(editPath, token);
      }
    });

    async function loadArticle(path, token) {
      if (!token) {
        token = document.getElementById('token').value.trim();
      }
      if (!token) {
        showStatus('请先输入 GitHub Token', true);
        return;
      }

      try {
        const res = await fetch(`https://api.github.com/repos/lens365/lens_website/contents/${path}`, {
          headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
        });
        if (res.ok) {
          const data = await res.json();
          const content = decodeURIComponent(escape(atob(data.content)));

          // 解析 front matter
          const match = content.match(/^\+\+\+([\s\S]*?)\+\+\+([\s\S]*)$/);
          if (match) {
            const frontMatter = match[1];
            const body = match[2].trim();

            const titleMatch = frontMatter.match(/title\s*=\s*"([^"]+)"/);
            const dateMatch = frontMatter.match(/date\s*=\s*"([^"]+)"/);
            const tagsMatch = frontMatter.match(/tags\s*=\s*\[(.*?)\]/);
            const catsMatch = frontMatter.match(/categories\s*=\s*\[(.*?)\]/);

            if (titleMatch) document.getElementById('title').value = titleMatch[1];
            if (dateMatch) document.getElementById('date').value = dateMatch[1];
            if (tagsMatch) {
              document.getElementById('tags').value = tagsMatch[1].split(',').map(s => s.trim().replace(/"/g, '')).join(', ');
            }
            if (catsMatch) {
              document.getElementById('categories').value = catsMatch[1].split(',').map(s => s.trim().replace(/"/g, '')).join(', ');
            }

            easyMDE.value(body);
            document.getElementById('filename').value = path.replace('content/posts/', '').replace('.md', '');

            // 显示编辑区域
            document.querySelector('.section:last-child').style.display = 'block';
            showStatus('文章已加载，可以开始编辑', false);
          }
        } else {
          showStatus('加载文章失败，请检查 Token 是否有权限', true);
        }
      } catch (err) {
        showStatus('加载文章失败: ' + err.message, true);
      }
    }

    async function publish() {
      const token = document.getElementById('token').value.trim();
      const title = document.getElementById('title').value.trim();
      let filename = document.getElementById('filename').value.trim();
      const date = document.getElementById('date').value;
      const categories = document.getElementById('categories').value.split(',').map(s => s.trim()).filter(s => s);
      const tags = document.getElementById('tags').value.split(',').map(s => s.trim()).filter(s => s);
      const content = easyMDE.value();

      if (!token) { showStatus('请输入 GitHub Token', true); return; }
      if (!title) { showStatus('请输入标题', true); return; }
      if (!filename) { filename = title.toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]+/g, '-').replace(/^-|-$/g, ''); }
      if (!date) { showStatus('请选择日期', true); return; }

      const btn = document.getElementById('submit');
      btn.disabled = true;
      const originalText = btn.textContent;
      btn.textContent = editPath ? '保存中...' : '发布中...';

      // 发布前，先把文章中的 base64 图片上传到 GitHub
      let processedContent = content;
      if (token) {
        processedContent = await processBase64Images(content, token);
      }

      let frontMatter = `+++\ntitle = "${title}"\ndescription = "${title} - Lens Note"\ndate = "${date}"\ndraft = false\n`;
      if (tags.length) frontMatter += `tags = [${tags.map(t => `"${t}"`).join(', ')}]\n`;
      if (categories.length) frontMatter += `categories = [${categories.map(c => `"${c}"`).join(', ')}]\n`;
      frontMatter += `+++\n\n${processedContent}`;

      const path = editPath || `content/posts/${filename}.md`;
      const encodedContent = btoa(unescape(encodeURIComponent(frontMatter)));

      try {
        let sha = null;
        try {
          const checkRes = await fetch(`https://api.github.com/repos/lens365/lens_website/contents/${path}`, {
            headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
          });
          if (checkRes.status === 200) {
            const data = await checkRes.json();
            sha = data.sha;
          }
        } catch (e) { }

        const body = {
          message: editPath ? `post: update ${filename}` : `post: add ${filename}`,
          content: encodedContent,
          branch: 'main'
        };
        if (sha) body.sha = sha;

        const res = await fetch(`https://api.github.com/repos/lens365/lens_website/contents/${path}`, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(body)
        });

        if (res.ok) {
          showStatus(`${editPath ? '修改成功' : '发布成功'}！文章将自动部署后显示`, false);
          if (!editPath) {
            clearForm();
          }
        } else {
          const err = await res.json();
          showStatus(`失败: ${err.message || res.statusText}`, true);
        }
      } catch (err) {
        showStatus(`错误: ${err.message}`, true);
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    }
  </script>
</body>

</html>
